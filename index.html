 all();$("#conn").textContent="متصل — بيتحدث كل 10 دقايق • آخر تحديث "+new Date().toLocaleTimeString("ar-EG-u-nu-latn",{hour:"2-digit",minute:"2-digit"})}
 catch(e){$("#conn").textContent="مش قادر أتصل بالمقر دلوقتي، هحاول تاني تلقائي."}}
$("#compose").addEventListener("submit",async e=>{e.preventDefault();const title=$("#tt").value.trim(),to=$("#to").value;if(!title)return;$("#send").disabled=true;
 try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title:title.slice(0,120),details:title,assignee:to})});if(!r.ok)throw 0;
  $("#tt").value="";$("#hint").textContent="وصلت المهمة ✅ هتتنفذ في أقرب تشغيلة، والتقرير هيوصلك على تيليجرام.";setTimeout(load,1500)}
 catch(err){$("#hint").textContent="الإرسال ما نجحش، جرّب كمان شوية."}$("#send").disabled=false});
all();load();setInterval(()=>{if(!document.hidden)load()},600000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
const h=location.hash.slice(1);if(DEPTS.some(d=>d.id===h))openRoom(h);
const CALL=new URLSearchParams(location.search).get("call");
if(CALL&&STAFF.some(p=>p.id===CALL)){const p=STAFF.find(x=>x.id===CALL);if(cur!==p.dept)openRoom(p.dept);setTimeout(()=>callP(CALL),1200)}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,recOn=false;
function startMic(){const b=$("#mic");if(!SR){$("#hint").textContent="المتصفح ده مش بيدعم التسجيل — استخدم زرار المايك اللي في كيبورد الموبايل وهو بيكتب لوحده.";$("#tt").focus();return}
 if(recOn){rec.stop();return}
 rec=new SR();rec.lang="ar-EG";rec.continuous=true;rec.interimResults=true;const base=$("#tt").value?$("#tt").value.trim()+" ":"";
 rec.onresult=e=>{let t="";for(const r of e.results)t+=r[0].transcript;$("#tt").value=base+t};
 rec.onend=()=>{recOn=false;b.textContent="🎤 سجّل بصوتك";b.style.background="#1f9d55";$("#hint").textContent=$("#tt").value?"راجع الكلام واضغط «ابعت».":""};
 rec.onerror=()=>{$("#hint").textContent="ما قدرتش أسمعك — اسمح للمايك وجرّب تاني."};
 rec.start();recOn=true;b.textContent="⏹ وقف التسجيل";b.style.background="#c0392b";$("#hint").textContent="بسمعك… قول المهمة، وبعدين اضغط «وقف التسجيل»."}
$("#mic").onclick=startMic;
$("#dvoice").onclick=()=>{$("#dassign").onclick();setTimeout(startMic,400)};
</script>
</body></html>
